# A single EC2 host is not HA; scaling is manual. Back up the db-data and letsencrypt
# volumes off-host: recreating containers preserves volumes, replacing the host does not.
# Only a Flask API is specified in this repository. Until a separate web implementation
# exists, web serves the same Flask application on port 3000 (not a distinct frontend).
# nginx:stable is requested but is a moving tag; supply an approved digest to truly pin it.
# The spec supplies no certbot or MySQL digest; lock the approved versions/digests before production use.
name: notes-app
x-logs: &logs
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
services:
  proxy:
    image: nginx:stable
    restart: unless-stopped
    command: /bin/sh -c 'while :; do sleep 6h & wait $!; nginx -s reload; done & nginx -g "daemon off;"'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - api
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1/healthz >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logs
  certbot:
    image: certbot/certbot:v3.2.0
    restart: unless-stopped
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $!; done'
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    logging: *logs
  web:
    image: ${DA_ECR_REPOSITORY_URL:?}:${IMAGE_TAG:?}
    restart: unless-stopped
    env_file: web.env
    command: ['gunicorn', '--bind', '0.0.0.0:3000', '--workers', '2', '--access-logfile', '-', '--error-logfile', '-', 'app:app']
    expose: ['3000']
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logs
  api:
    image: ${DA_ECR_REPOSITORY_URL:?}:${IMAGE_TAG:?}
    restart: unless-stopped
    env_file: api.env
    expose: ['8080']
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logs
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file: db.env
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 --silent']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    logging: *logs
volumes:
  db-data:
  certbot-www:
  letsencrypt:
