# This is a single-VM deployment: it has no HA and scaling is manual. Keep durable
# database state in the named volume (or migrate it to an external managed store).
services:
  proxy:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $!; nginx -s reload; done & nginx -g 'daemon off;'"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      - web
      - api

  certbot:
    # Pin this image to an approved Certbot release when one is selected for the deployment.
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot:rw
      - letsencrypt:/etc/letsencrypt:rw
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $!; done"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    image: ${APP_IMAGE:?APP_IMAGE must be set to the immutable ECR image tag}
    restart: unless-stopped
    env_file:
      - web.env
    environment:
      PORT: "3000"
    command: ["gunicorn", "--bind", "0.0.0.0:3000", "--workers", "2", "--access-logfile", "-", "--error-logfile", "-", "app:app"]
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    image: ${APP_IMAGE:?APP_IMAGE must be set to the immutable ECR image tag}
    restart: unless-stopped
    env_file:
      - api.env
    environment:
      PORT: "8080"
    command: ["gunicorn", "--bind", "0.0.0.0:8080", "--workers", "2", "--access-logfile", "-", "--error-logfile", "-", "app:app"]
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    # Persistent volume prevents ordinary container replacement from deleting DB state.
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - db.env
    volumes:
      - mysql-data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  mysql-data:
  certbot-www:
  letsencrypt:
