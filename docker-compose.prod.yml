# ENGINE-RENDERED by devops-agent (knowledge/delivery) from the services this repo defines — do not
# edit; regenerate instead. Your own docker-compose.yml is never touched. Only the proxy publishes ports.
name: app
services:
  proxy:
    image: "nginx:1.30-alpine"
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $$!; nginx -s reload; done & nginx -g 'daemon off;'"]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  certbot:
    image: "certbot/certbot:v5.8.0"
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done"]
    logging: *logging
  api:
    image: "${REGISTRY:?}:api-${IMAGE_TAG:?}"
    restart: unless-stopped
    env_file: ["api.env"]
    expose: ["8080"]
    depends_on:
      db: { condition: service_healthy }
    logging: *logging
  web:
    image: "${REGISTRY:?}:web-${IMAGE_TAG:?}"
    restart: unless-stopped
    env_file: ["web.env"]
    expose: ["3000"]
    depends_on:
      db: { condition: service_healthy }
    logging: *logging
  db:
    image: "mysql:8.4"
    restart: unless-stopped
    env_file: ["db.env"]
    volumes: ["db-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    logging: *logging
volumes:
  certbot-www: {}
  letsencrypt: {}
  db-data: {}
