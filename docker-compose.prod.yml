name: notes-app

services:
  proxy:
    # Pin the nginx image; this is the only service exposed to the host network.
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    command: /bin/sh -c 'while :; do sleep 6h & wait $$!; nginx -s reload; done & nginx -g "daemon off;"'
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $$!; done'
    logging: *default-logging

  web:
    image: ${DA_ECR_REPOSITORY_URL:?DA_ECR_REPOSITORY_URL must be set}:${IMAGE_TAG:?IMAGE_TAG must be set}
    restart: unless-stopped
    command: ["gunicorn", "--bind", "0.0.0.0:3000", "--access-logfile", "-", "--error-logfile", "-", "app:app"]
    env_file:
      - web.env
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  api:
    image: ${DA_ECR_REPOSITORY_URL:?DA_ECR_REPOSITORY_URL must be set}:${IMAGE_TAG:?IMAGE_TAG must be set}
    restart: unless-stopped
    command: ["gunicorn", "--bind", "0.0.0.0:8080", "--access-logfile", "-", "--error-logfile", "-", "app:app"]
    env_file:
      - api.env
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  db:
    image: mysql:8.4.4
    restart: unless-stopped
    env_file:
      - db.env
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

volumes:
  mysql-data:
  certbot-www:
  letsencrypt:

# This single-VM Compose deployment is a single point of failure, has no HA,
# and scales only by manually resizing the VM or re-architecting. Database
# state is retained in a named volume; back it up independently of redeploys.
