# A single EC2 host has no HA or automatic scaling: use a larger host or redesign for those needs.
# No app state is stored in container layers; MySQL and TLS data survive redeploys in volumes.
services:
  proxy:
    image: nginx:1.28.0
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    command: /bin/sh -c 'while :; do sleep 6h & wait $$!; nginx -s reload; done & nginx -g "daemon off;"'
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  certbot:
    image: certbot/certbot:v4.2.0
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $$!; done'
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  web:
    image: ${DA_ECR_REPOSITORY_URL:?}:${IMAGE_TAG:?}
    restart: unless-stopped
    env_file: web.env
    command: [gunicorn, --bind, '0.0.0.0:3000', --workers, '2', --access-logfile, '-', --error-logfile, '-', 'app:app']
    expose: ['3000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  api:
    image: ${DA_ECR_REPOSITORY_URL:?}:${IMAGE_TAG:?}
    restart: unless-stopped
    env_file: api.env
    expose: ['8080']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  db:
    image: mysql:8.4.7
    restart: unless-stopped
    env_file: db.env
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 --silent']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
volumes:
  mysql-data:
  certbot-www:
  letsencrypt:
