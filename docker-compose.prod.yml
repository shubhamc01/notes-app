# Single EC2 host: no HA; scaling requires a bigger host or re-architecture.
# Database and ACME state live in named volumes; never store durable data in
# an application container. nginx configs under deploy/nginx/ are host-managed.
# nginx:stable is the specifically requested stable tag; pin it by digest when
# the platform supplies an approved digest (none is supplied in this task).
services:
  proxy:
    image: nginx:stable
    restart: unless-stopped
    command: /bin/sh -c 'while :; do sleep 6h & wait $!; nginx -s reload; done & nginx -g "daemon off;"'
    env_file:
      - ./proxy.env
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: [CMD-SHELL, 'nginx -t']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  certbot:
    image: certbot/certbot:v3.3.0
    restart: unless-stopped
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $!; done'
    env_file:
      - ./certbot.env
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    logging: *logging

  web:
    image: ${DA_ECR_REPOSITORY_URL:?repository URL required}:web-${IMAGE_TAG:?image tag required}
    restart: unless-stopped
    env_file:
      - path: ./web.env
        format: raw
    expose:
      - '3000'
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:3000/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *logging

  api:
    image: ${DA_ECR_REPOSITORY_URL:?repository URL required}:api-${IMAGE_TAG:?image tag required}
    restart: unless-stopped
    env_file:
      - path: ./api.env
        format: raw
    expose:
      - '8080'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *logging

  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - path: ./db.env
        format: raw
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping --host=127.0.0.1 --silent']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    logging: *logging

volumes:
  mysql-data:
  certbot-www:
  letsencrypt:
