# Single-VM deployment: no HA and scaling requires a larger host or re-architecture.
# Persist database data and certificates in volumes; never rely on container filesystems.
services:
  web:
    image: ${DA_ECR_REPOSITORY_URL:?required}:web-${IMAGE_TAG:?required}
    env_file: web.env
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  api:
    image: ${DA_ECR_REPOSITORY_URL:?required}:api-${IMAGE_TAG:?required}
    env_file: api.env
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  db:
    image: mysql:8.4.7
    env_file: db.env
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -e 'SELECT 1' \"$$MYSQL_DATABASE\" >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
  proxy:
    image: nginx:1.28.0-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    command: /bin/sh -c 'while :; do sleep 6h & wait $!; nginx -s reload; done & nginx -g "daemon off;"'
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 30s
      timeout: 5s
      retries: 3
  certbot:
    image: certbot/certbot:v4.0.0
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $!; done'
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
volumes:
  mysql-data:
  certbot-www:
  letsencrypt:
