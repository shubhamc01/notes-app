name: Infrastructure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      ready: ${{ steps.bootstrap.outputs.ready }}
    steps:
      - id: bootstrap
        name: Check infrastructure bootstrap variables
        env:
          AWS_REGION: ${{ vars.DA_AWS_REGION }}
          PLAN_ROLE_ARN: ${{ vars.DA_INFRA_PLAN_ROLE_ARN }}
        shell: bash
        run: |
          if [[ -z "$AWS_REGION" || -z "$PLAN_ROLE_ARN" ]]; then
            echo "infrastructure bootstrap not applied yet — run devops-agent up (or apply) first"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.bootstrap.outputs.ready == 'true'

      - name: Configure read-only AWS credentials (OIDC)
        if: steps.bootstrap.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DA_INFRA_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.DA_AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Set up Terraform
        if: steps.bootstrap.outputs.ready == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format, validate, plan, policy-check, and summarize (infra/dev)
        if: steps.bootstrap.outputs.ready == 'true'
        env:
          AWS_REGION: ${{ vars.DA_AWS_REGION }}
          STATE_BUCKET: ${{ vars.DA_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          root=infra/dev
          plan_file="$RUNNER_TEMP/dev.tfplan"
          plan_json="$RUNNER_TEMP/dev-plan.json"

          terraform fmt -check -recursive "$root"
          terraform -chdir="$root" init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=infra/dev/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"
          terraform -chdir="$root" validate
          terraform -chdir="$root" plan -input=false -lock=false -out="$plan_file"
          terraform -chdir="$root" show -json "$plan_file" > "$plan_json"
          python3 infra/policy_check.py "$root" "$plan_json"

          python3 - "$plan_json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          plan_path, summary_path = sys.argv[1:]
          with open(plan_path, encoding="utf-8") as source:
              plan = json.load(source)
          with open(summary_path, "a", encoding="utf-8") as summary:
              summary.write("## Terraform plan — infra/dev\n\n")
              changes = plan.get("resource_changes", [])
              if not changes:
                  summary.write("No resource changes.\n")
              else:
                  summary.write("| Resource address | Actions |\n|---|---|\n")
                  for item in changes:
                      actions = ", ".join(item.get("change", {}).get("actions", []))
                      address = item.get("address", "")
                      summary.write(f"| `{address}` | `{actions}` |\n")
          PY

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Configure required reviewers on the GitHub Environment named dev-infra.
    environment: dev-infra
    permissions:
      contents: read
      id-token: write
    steps:
      # Bootstrap is deliberately human-applied at the CLI and is never planned or applied here.
      - id: bootstrap
        name: Check infrastructure bootstrap variables
        env:
          AWS_REGION: ${{ vars.DA_AWS_REGION }}
          PLAN_ROLE_ARN: ${{ vars.DA_INFRA_PLAN_ROLE_ARN }}
        shell: bash
        run: |
          if [[ -z "$AWS_REGION" || -z "$PLAN_ROLE_ARN" ]]; then
            echo "infrastructure bootstrap not applied yet — run devops-agent up (or apply) first"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.bootstrap.outputs.ready == 'true'

      - name: Configure dev apply credentials (OIDC)
        if: steps.bootstrap.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DA_INFRA_APPLY_ROLE_ARN_DEV }}
          aws-region: ${{ vars.DA_AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Set up Terraform
        if: steps.bootstrap.outputs.ready == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Plan, policy-check, and apply the exact saved plan (infra/dev)
        if: steps.bootstrap.outputs.ready == 'true'
        env:
          AWS_REGION: ${{ vars.DA_AWS_REGION }}
          STATE_BUCKET: ${{ vars.DA_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          root=infra/dev
          plan_file="$RUNNER_TEMP/dev.tfplan"
          plan_json="$RUNNER_TEMP/dev-plan.json"

          terraform fmt -check -recursive "$root"
          terraform -chdir="$root" init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=infra/dev/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"
          terraform -chdir="$root" validate
          terraform -chdir="$root" plan -input=false -out="$plan_file"
          terraform -chdir="$root" show -json "$plan_file" > "$plan_json"
          python3 infra/policy_check.py "$root" "$plan_json"
          terraform -chdir="$root" apply -input=false "$plan_file"
