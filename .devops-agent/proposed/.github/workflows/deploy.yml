name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      # Keep this first: an unbootstrapped repository should fail with a clear message.
      - name: Check deployment bootstrap variables
        env:
          AWS_REGION: ${{ vars.DA_AWS_REGION }}
          ROLE_ARN: ${{ vars.DA_DEPLOY_ROLE_ARN_DEV }}
          REPOSITORY: ${{ vars.DA_ECR_REPOSITORY_URL }}
          INSTANCE_ID: ${{ vars.DA_HOST_INSTANCE_ID_DEV }}
          HOST_IP: ${{ vars.DA_HOST_IP_DEV }}
          HOST_URL: ${{ vars.DA_HOST_URL_DEV }}
        shell: bash
        run: |
          missing=()
          for name in AWS_REGION ROLE_ARN REPOSITORY INSTANCE_ID HOST_IP HOST_URL; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "infrastructure not applied yet (missing required dev deployment variables: ${missing[*]})" >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DA_DEPLOY_ROLE_ARN_DEV }}
          aws-region: ${{ vars.DA_AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Sign in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable application image
        env:
          REPOSITORY: ${{ vars.DA_ECR_REPOSITORY_URL }}
          TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          repository_name="${REPOSITORY##*/}"
          if aws ecr describe-images \
            --repository-name "$repository_name" \
            --image-ids "imageTag=$TAG" >/dev/null 2>&1; then
            echo "Application image tag already exists; skipping push."
          else
            docker build --tag "${REPOSITORY}:${TAG}" .
            docker push "${REPOSITORY}:${TAG}"
          fi

      - name: Build and push host deployment bundle
        env:
          REPOSITORY: ${{ vars.DA_ECR_REPOSITORY_URL }}
          TAG: bundle-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          repository_name="${REPOSITORY##*/}"
          if aws ecr describe-images \
            --repository-name "$repository_name" \
            --image-ids "imageTag=$TAG" >/dev/null 2>&1; then
            echo "Deployment bundle tag already exists; skipping push."
            exit 0
          fi

          bundle_dir="$(mktemp -d)"
          trap 'rm -rf "$bundle_dir"' EXIT
          cp docker-compose.prod.yml "$bundle_dir/"
          cp -R deploy "$bundle_dir/"
          cat > "$bundle_dir/Dockerfile" <<'EOF'
          FROM scratch
          COPY docker-compose.prod.yml deploy/ /app/
          EOF
          docker build --tag "${REPOSITORY}:${TAG}" "$bundle_dir"
          docker push "${REPOSITORY}:${TAG}"

      - name: Deploy on EC2 through SSM Run Command
        env:
          AWS_REGION: ${{ vars.DA_AWS_REGION }}
          INSTANCE_ID: ${{ vars.DA_HOST_INSTANCE_ID_DEV }}
          HOST_IP: ${{ vars.DA_HOST_IP_DEV }}
          HOST_URL: ${{ vars.DA_HOST_URL_DEV }}
          SITE_DOMAINS: ${{ vars.DA_SITE_DOMAINS_DEV }}
          REPOSITORY: ${{ vars.DA_ECR_REPOSITORY_URL }}
          IMAGE_TAG: ${{ github.sha }}
          BUNDLE_TAG: bundle-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shlex

          values = {
              "DA_AWS_REGION": os.environ["AWS_REGION"],
              "DA_ECR_REPOSITORY_URL": os.environ["REPOSITORY"],
              "DA_HOST_IP_DEV": os.environ["HOST_IP"],
              "DA_HOST_URL_DEV": os.environ["HOST_URL"],
              "DA_SITE_DOMAINS_DEV": os.environ.get("SITE_DOMAINS", ""),
              "DEPLOY_ENV": "dev",
              "IMAGE_TAG": os.environ["IMAGE_TAG"],
              "BUNDLE_TAG": os.environ["BUNDLE_TAG"],
          }
          host_script = ["set -euo pipefail"]
          for key, value in values.items():
              host_script.append(f"export {key}={shlex.quote(value)}")
          host_script.extend([
              'registry="${DA_ECR_REPOSITORY_URL%%/*}"',
              'aws ecr get-login-password --region "$DA_AWS_REGION" | docker login --username AWS --password-stdin "$registry"',
              'docker pull "${DA_ECR_REPOSITORY_URL}:${BUNDLE_TAG}"',
              'id=$(docker create "${DA_ECR_REPOSITORY_URL}:${BUNDLE_TAG}" noop)',
              'trap \'docker rm -f "$id" >/dev/null 2>&1 || true\' EXIT',
              'mkdir -p /opt/app',
              'docker cp "$id:/app/." /opt/app/',
              'docker rm "$id"',
              'trap - EXIT',
              'cd /opt/app',
              'chmod +x ./deploy/deploy.sh',
              './deploy/deploy.sh',
          ])
          command = "bash -lc " + shlex.quote("\n".join(host_script))
          with open("/tmp/ssm-commands.json", "w", encoding="utf-8") as output:
              json.dump({"commands": [command]}, output)
          PY

          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${IMAGE_TAG}" \
            --parameters file:///tmp/ssm-commands.json \
            --query 'Command.CommandId' --output text)"

          if ! aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --region "$AWS_REGION" --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Output:StandardErrorContent}' --output json || true
            exit 1
          fi
          status="$(aws ssm get-command-invocation \
            --region "$AWS_REGION" --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" --query Status --output text)"
          if [[ "$status" != Success ]]; then
            aws ssm get-command-invocation \
              --region "$AWS_REGION" --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Output:StandardErrorContent}' --output json
            exit 1
          fi
