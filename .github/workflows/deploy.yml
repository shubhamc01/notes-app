name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: notes-app-dev-deploy
  cancel-in-progress: false
jobs:
  dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Mask bindings and check infrastructure
        env:
          DA_AWS_REGION: ${{ vars.DA_AWS_REGION }}
          DA_DEPLOY_ROLE_ARN_DEV: ${{ vars.DA_DEPLOY_ROLE_ARN_DEV }}
          DA_ECR_REPOSITORY_URL: ${{ vars.DA_ECR_REPOSITORY_URL }}
          DA_HOST_INSTANCE_ID_DEV: ${{ vars.DA_HOST_INSTANCE_ID_DEV }}
          DA_HOST_IP_DEV: ${{ vars.DA_HOST_IP_DEV }}
          DA_HOST_URL_DEV: ${{ vars.DA_HOST_URL_DEV }}
          DA_SITE_DOMAINS_DEV: ${{ vars.DA_SITE_DOMAINS_DEV }}
        run: |
          set -euo pipefail
          for value in "$DA_AWS_REGION" "$DA_DEPLOY_ROLE_ARN_DEV" "$DA_ECR_REPOSITORY_URL" "$DA_HOST_INSTANCE_ID_DEV" "$DA_HOST_IP_DEV" "$DA_HOST_URL_DEV" "$DA_SITE_DOMAINS_DEV"; do
            if [[ -n "$value" ]]; then echo "::add-mask::$value"; fi
          done
          for value in "$DA_AWS_REGION" "$DA_DEPLOY_ROLE_ARN_DEV" "$DA_ECR_REPOSITORY_URL" "$DA_HOST_INSTANCE_ID_DEV" "$DA_HOST_IP_DEV" "$DA_HOST_URL_DEV"; do
            if [[ -z "$value" ]]; then echo 'infrastructure not applied yet' >&2; exit 1; fi
          done
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.DA_AWS_REGION }}
          role-to-assume: ${{ vars.DA_DEPLOY_ROLE_ARN_DEV }}
          audience: sts.amazonaws.com
          mask-aws-account-id: true
      - name: Build and push immutable application and bundle images
        env:
          DA_ECR_REPOSITORY_URL: ${{ vars.DA_ECR_REPOSITORY_URL }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repository="${DA_ECR_REPOSITORY_URL##*/}"
          registry="${DA_ECR_REPOSITORY_URL%%/*}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry" >/dev/null
          for service in api web bundle; do
            tag="${service}-${SHA}"
            if aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$tag" >/dev/null 2>&1; then
              continue
            fi
            case "$service" in
              api) docker build -t "${DA_ECR_REPOSITORY_URL}:$tag" . ;;
              web) docker build -t "${DA_ECR_REPOSITORY_URL}:$tag" ./web ;;
              bundle) docker build -f deploy/Dockerfile.bundle -t "${DA_ECR_REPOSITORY_URL}:$tag" . ;;
            esac
            docker push "${DA_ECR_REPOSITORY_URL}:$tag"
          done
      - name: Deploy and wait for SSM result
        env:
          DA_AWS_REGION: ${{ vars.DA_AWS_REGION }}
          DA_ECR_REPOSITORY_URL: ${{ vars.DA_ECR_REPOSITORY_URL }}
          DA_HOST_INSTANCE_ID_DEV: ${{ vars.DA_HOST_INSTANCE_ID_DEV }}
          DA_HOST_IP_DEV: ${{ vars.DA_HOST_IP_DEV }}
          DA_HOST_URL_DEV: ${{ vars.DA_HOST_URL_DEV }}
          DA_SITE_DOMAINS_DEV: ${{ vars.DA_SITE_DOMAINS_DEV }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shlex
          names = ['DA_AWS_REGION', 'DA_ECR_REPOSITORY_URL', 'DA_HOST_IP_DEV', 'DA_HOST_URL_DEV', 'DA_SITE_DOMAINS_DEV']
          exports = [f'export {name}={shlex.quote(os.environ[name])}' for name in names]
          exports += [f'export IMAGE_TAG={shlex.quote(os.environ["SHA"])}', 'export DEPLOY_ENV=dev']
          script = '\n'.join(['set -eu', *exports, 'registry="${DA_ECR_REPOSITORY_URL%%/*}"',
              'aws ecr get-login-password --region "$DA_AWS_REGION" | docker login --username AWS --password-stdin "$registry"',
              'docker pull "$DA_ECR_REPOSITORY_URL:bundle-$IMAGE_TAG"',
              'mkdir -p /opt/app', 'id=$(docker create "$DA_ECR_REPOSITORY_URL:bundle-$IMAGE_TAG" noop)',
              'trap "docker rm -f $id >/dev/null" EXIT', 'docker cp "$id:/app/." /opt/app/',
              'docker rm "$id" >/dev/null', 'trap - EXIT', 'cd /opt/app',
              'bash ./deploy/deploy.sh'])
          with open('ssm-parameters.json', 'w') as f:
              json.dump({'commands': [script], 'executionTimeout': ['3600']}, f)
          PY
          trap 'rm -f ssm-parameters.json' EXIT
          command_id=$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$DA_HOST_INSTANCE_ID_DEV" --parameters file://ssm-parameters.json --timeout-seconds 600 --query 'Command.CommandId' --output text)
          for _ in {1..120}; do
            sleep 30
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$DA_HOST_INSTANCE_ID_DEV" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) echo 'Deployment healthy'; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) echo "SSM deployment failed: $status (command $command_id)" >&2; exit 1 ;;
            esac
          done
          echo "SSM deployment timed out: $command_id" >&2
          exit 1
