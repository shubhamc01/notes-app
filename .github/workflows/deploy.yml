name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Build and deploy dev
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check dev infrastructure variables
        env:
          AWS_REGION: ${{ vars.DA_AWS_REGION }}
          ROLE_ARN: ${{ vars.DA_DEPLOY_ROLE_ARN_DEV }}
          REPOSITORY: ${{ vars.DA_ECR_REPOSITORY_URL }}
          INSTANCE_ID: ${{ vars.DA_HOST_INSTANCE_ID_DEV }}
          HOST_IP: ${{ vars.DA_HOST_IP_DEV }}
          HOST_URL: ${{ vars.DA_HOST_URL_DEV }}
        run: |
          set -eu
          for name in AWS_REGION ROLE_ARN REPOSITORY INSTANCE_ID HOST_IP HOST_URL; do
            if [ -z "${!name}" ]; then
              echo 'infrastructure not applied yet' >&2
              exit 1
            fi
          done

      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DA_DEPLOY_ROLE_ARN_DEV }}
          aws-region: ${{ vars.DA_AWS_REGION }}

      - name: Login to ECR
        env:
          REPOSITORY: ${{ vars.DA_ECR_REPOSITORY_URL }}
          AWS_REGION: ${{ vars.DA_AWS_REGION }}
        run: |
          set -euo pipefail
          registry="${REPOSITORY%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$registry"

      - name: Build and push immutable application image and deployment bundle
        id: publish
        env:
          REPOSITORY: ${{ vars.DA_ECR_REPOSITORY_URL }}
          AWS_REGION: ${{ vars.DA_AWS_REGION }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo_name="${REPOSITORY##*/}"
          image_tag="$COMMIT_SHA"
          bundle_tag="bundle-$COMMIT_SHA"
          image="$REPOSITORY:$image_tag"
          bundle="$REPOSITORY:$bundle_tag"

          tag_exists() {
            local tag="$1"
            local found
            found=$(aws ecr list-images \
              --repository-name "$repo_name" \
              --filter tagStatus=TAGGED \
              --query "imageIds[?imageTag=='$tag'].imageTag | [0]" \
              --output text \
              --region "$AWS_REGION")
            [ "$found" != "None" ] && [ -n "$found" ]
          }

          if tag_exists "$image_tag"; then
            echo "Application tag already exists; reusing $image"
          else
            docker build --pull --tag "$image" .
            docker push "$image"
          fi

          if tag_exists "$bundle_tag"; then
            echo "Bundle tag already exists; skipping immutable-tag push"
          else
            docker build --pull --file - --tag "$bundle" . <<'DOCKERFILE'
          FROM scratch
          COPY docker-compose.prod.yml deploy/ /app/
          DOCKERFILE
            docker push "$bundle"
          fi

          {
            echo "image=$image"
            echo "bundle=$bundle"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy through SSM Run Command
        env:
          AWS_REGION: ${{ vars.DA_AWS_REGION }}
          INSTANCE_ID: ${{ vars.DA_HOST_INSTANCE_ID_DEV }}
          HOST_IP: ${{ vars.DA_HOST_IP_DEV }}
          HOST_URL: ${{ vars.DA_HOST_URL_DEV }}
          SITE_DOMAINS: ${{ vars.DA_SITE_DOMAINS_DEV }}
          IMAGE: ${{ steps.publish.outputs.image }}
          BUNDLE: ${{ steps.publish.outputs.bundle }}
          REPOSITORY: ${{ vars.DA_ECR_REPOSITORY_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/ssm-input.json
          import json
          import os
          import shlex

          region = os.environ['AWS_REGION']
          registry = os.environ['REPOSITORY'].split('/', 1)[0]
          assignments = {
              'DA_AWS_REGION': region,
              'DA_HOST_IP_DEV': os.environ['HOST_IP'],
              'DA_HOST_URL_DEV': os.environ['HOST_URL'],
              'DA_SITE_DOMAINS_DEV': os.environ.get('SITE_DOMAINS', ''),
          }
          export_args = ' '.join(
              f'{key}={shlex.quote(value)}' for key, value in assignments.items()
          )
          commands = [
              'set -eu',
              f'aws ecr get-login-password --region {shlex.quote(region)} | '
              f'docker login --username AWS --password-stdin {shlex.quote(registry)}',
              f'docker pull {shlex.quote(os.environ["BUNDLE"])}',
              'mkdir -p /opt/app',
              f'id=$(docker create {shlex.quote(os.environ["BUNDLE"])} noop)',
              'docker cp "$id:/app/." /opt/app/',
              'docker rm "$id"',
              'cd /opt/app',
              f'export {export_args}; bash ./deploy/deploy.sh dev '
              f'{shlex.quote(os.environ["IMAGE"])}',
          ]
          request = {
              'DocumentName': 'AWS-RunShellScript',
              'InstanceIds': [os.environ['INSTANCE_ID']],
              'Parameters': {'commands': commands},
              'Comment': 'Deploy notes-app dev',
          }
          print(json.dumps(request))
          PY

          command_id=$(aws ssm send-command \
            --cli-input-json file:///tmp/ssm-input.json \
            --query 'Command.CommandId' --output text)
          remaining=60
          while [ "$remaining" -gt 0 ]; do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" --output json
                exit 1
                ;;
            esac
            remaining=$((remaining - 1))
            sleep 10
          done
          echo "SSM deployment timed out: $command_id" >&2
          exit 1
