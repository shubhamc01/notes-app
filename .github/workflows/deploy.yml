name: Deploy
# Only a successful CI run for a push to main can deploy; never deploy pull requests.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  dev:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    environment: dev
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Verify infrastructure bindings
        env:
          REGION: ${{ vars.DA_AWS_REGION }}
          ROLE: ${{ vars.DA_DEPLOY_ROLE_ARN_DEV }}
          REGISTRY: ${{ vars.DA_ECR_REPOSITORY_URL }}
          INSTANCE: ${{ vars.DA_HOST_INSTANCE_ID_DEV }}
          HOST_IP: ${{ vars.DA_HOST_IP_DEV }}
          HOST_URL: ${{ vars.DA_HOST_URL_DEV }}
        run: |
          for name in REGION ROLE REGISTRY INSTANCE HOST_IP HOST_URL; do
            if [ -z "${!name}" ]; then echo 'infrastructure not applied yet'; exit 1; fi
          done
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Assume dev deployment role via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.DA_AWS_REGION }}
          role-to-assume: ${{ vars.DA_DEPLOY_ROLE_ARN_DEV }}
          audience: sts.amazonaws.com
      - name: Build and push immutable application and bundle images
        env:
          REGISTRY: ${{ vars.DA_ECR_REPOSITORY_URL }}
          REGION: ${{ vars.DA_AWS_REGION }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          repo="${REGISTRY#*/}"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "${REGISTRY%%/*}"
          for tag in "$SHA" "bundle-$SHA"; do
            if aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=$tag" --region "$REGION" >/dev/null 2>&1; then
              echo "Immutable tag already present: $tag"
              continue
            fi
            if [ "$tag" = "$SHA" ]; then
              docker build -f Dockerfile -t "$REGISTRY:$tag" .
            else
              docker build -f Dockerfile.bundle -t "$REGISTRY:$tag" .
            fi
            docker push "$REGISTRY:$tag"
          done
      - name: Deliver bundle and deploy with SSM
        env:
          REGION: ${{ vars.DA_AWS_REGION }}
          REGISTRY: ${{ vars.DA_ECR_REPOSITORY_URL }}
          INSTANCE: ${{ vars.DA_HOST_INSTANCE_ID_DEV }}
          HOST_IP: ${{ vars.DA_HOST_IP_DEV }}
          HOST_URL: ${{ vars.DA_HOST_URL_DEV }}
          DOMAINS: ${{ vars.DA_SITE_DOMAINS_DEV }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Encode SSM commands as JSON and shell-quote each binding on the host.
          params=$(python3 - <<'PY'
          import json, os, shlex
          bindings = {
              'DA_AWS_REGION': os.environ['REGION'],
              'DA_ECR_REPOSITORY_URL': os.environ['REGISTRY'],
              'DA_HOST_IP_DEV': os.environ['HOST_IP'],
              'DA_HOST_URL_DEV': os.environ['HOST_URL'],
              'DA_SITE_DOMAINS_DEV': os.environ['DOMAINS'],
              'IMAGE_TAG': os.environ['SHA'],
              'DEPLOY_ENV': 'dev',
          }
          commands = [
              'set -eu',
              'mkdir -p /opt/app',
              *(f'export {key}={shlex.quote(value)}' for key, value in bindings.items()),
              'aws ecr get-login-password --region "$DA_AWS_REGION" | docker login --username AWS --password-stdin "${DA_ECR_REPOSITORY_URL%%/*}"',
              'docker pull "$DA_ECR_REPOSITORY_URL:bundle-$IMAGE_TAG"',
              'id=$(docker create "$DA_ECR_REPOSITORY_URL:bundle-$IMAGE_TAG" noop)',
              'trap \'docker rm -f "$id" >/dev/null 2>&1 || true\' EXIT',
              'docker cp "$id:/app/." /opt/app/',
              'docker rm "$id"',
              'trap - EXIT',
              'cd /opt/app',
              'chmod +x ./deploy/deploy.sh',
              './deploy/deploy.sh',
          ]
          print(json.dumps({'commands': commands}))
          PY
          )
          command_id=$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$INSTANCE" --parameters "$params" --timeout-seconds 3600 --query 'Command.CommandId' --output text)
          attempt=0
          while (( attempt < 240 )); do
            attempt=$((attempt + 1))
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) echo 'Deployment healthy'; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) echo "Deployment failed ($status); SSM command: $command_id"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Deployment timed out after $attempt checks; SSM command: $command_id"; exit 1
  notify-failure:
    if: ${{ failure() }}
    needs: [dev]
    runs-on: ubuntu-latest
    steps:
      - name: Notify if configured
        env:
          WEBHOOK: ${{ secrets.FAILURE_WEBHOOK_URL }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then exit 0; fi
          python3 - <<'PY'
          import json, os, urllib.request
          body = json.dumps({'text': f"Deploy failed: {os.environ['BRANCH']} {os.environ['COMMIT']} {os.environ['RUN_URL']}"}).encode()
          urllib.request.urlopen(urllib.request.Request(os.environ['WEBHOOK'], data=body, headers={'Content-Type': 'application/json'}), timeout=10).close()
          PY
