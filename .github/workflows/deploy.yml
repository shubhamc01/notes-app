name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: notes-app-dev-deploy
  cancel-in-progress: false

jobs:
  dev:
    # workflow_run must originate from a successful push in this repository.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - name: Check applied infrastructure
        env:
          REGION: ${{ vars.DA_AWS_REGION }}
          ROLE: ${{ vars.DA_DEPLOY_ROLE_ARN_DEV }}
          REGISTRY: ${{ vars.DA_ECR_REPOSITORY_URL }}
          INSTANCE: ${{ vars.DA_HOST_INSTANCE_ID_DEV }}
          HOST_IP: ${{ vars.DA_HOST_IP_DEV }}
          HOST_URL: ${{ vars.DA_HOST_URL_DEV }}
        run: |
          set -euo pipefail
          for name in REGION ROLE REGISTRY INSTANCE HOST_IP HOST_URL; do
            if [ -z "${!name}" ]; then
              echo 'infrastructure not applied yet' >&2
              exit 1
            fi
          done
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.DA_AWS_REGION }}
          role-to-assume: ${{ vars.DA_DEPLOY_ROLE_ARN_DEV }}
          audience: sts.amazonaws.com
      - name: Build and publish immutable images
        env:
          REGISTRY: ${{ vars.DA_ECR_REPOSITORY_URL }}
          REGION: ${{ vars.DA_AWS_REGION }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          registry_host="${REGISTRY%%/*}"
          repository="${REGISTRY#*/}"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$registry_host"
          for kind in app bundle; do
            if [ "$kind" = app ]; then
              tag="$sha"
              file=Dockerfile
            else
              tag="bundle-$sha"
              file=Dockerfile.bundle
            fi
            if aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$tag" --region "$REGION" >/dev/null 2>&1; then
              echo "Already published immutable tag: $tag"
            else
              docker build -f "$file" -t "$REGISTRY:$tag" .
              docker push "$REGISTRY:$tag"
            fi
          done
      - name: Deploy bundle on EC2 with SSM and wait for health
        env:
          REGISTRY: ${{ vars.DA_ECR_REPOSITORY_URL }}
          REGION: ${{ vars.DA_AWS_REGION }}
          INSTANCE: ${{ vars.DA_HOST_INSTANCE_ID_DEV }}
          HOST_IP: ${{ vars.DA_HOST_IP_DEV }}
          HOST_URL: ${{ vars.DA_HOST_URL_DEV }}
          DOMAINS: ${{ vars.DA_SITE_DOMAINS_DEV }}
        run: |
          set -euo pipefail
          DEPLOY_SHA="$(git rev-parse HEAD)"
          export DEPLOY_SHA
          python3 - <<'PY'
          import json
          import os
          import shlex
          from pathlib import Path

          q = shlex.quote
          registry = os.environ['REGISTRY']
          sha = os.environ['DEPLOY_SHA']
          region = os.environ['REGION']
          host = registry.split('/', 1)[0]
          args = ['dev', sha, registry, os.environ['HOST_URL'],
                  os.environ['HOST_IP'], os.environ['DOMAINS']]
          script = '\n'.join([
              'set -eu',
              'mkdir -p /opt/app',
              f'aws ecr get-login-password --region {q(region)} | docker login --username AWS --password-stdin {q(host)}',
              f'docker pull {q(registry + ":bundle-" + sha)}',
              f'id=$(docker create {q(registry + ":bundle-" + sha)} noop)',
              'trap \'docker rm "$id" >/dev/null 2>&1 || true\' EXIT',
              'docker cp "$id:/app/." /opt/app/',
              'docker rm "$id"',
              'trap - EXIT',
              'cd /opt/app',
              './deploy/deploy.sh ' + ' '.join(map(q, args)),
          ])
          Path('ssm-request.json').write_text(json.dumps({'commands': [script]}))
          PY
          command_id="$(aws ssm send-command --document-name AWS-RunShellScript --instance-ids "$INSTANCE" --timeout-seconds 1800 --parameters file://ssm-request.json --query 'Command.CommandId' --output text)"
          rm -f ssm-request.json
          for attempt in $(seq 1 180); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success) echo "SSM deployment and proxy health check succeeded: $command_id"; exit 0 ;;
              Failed|Cancelled|TimedOut) aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE" --query '[StatusDetails,StandardErrorContent]' --output text >&2; exit 1 ;;
            esac
            if [ "$attempt" -eq 180 ]; then break; fi
            sleep 10
          done
          echo "SSM deployment timed out: $command_id" >&2
          exit 1
