# ENGINE-RENDERED by devops-agent (knowledge/delivery) — do not edit; regenerate instead.
# Runs after CI passes on main; one job per environment, in promotion order. Every
# infrastructure value is a repository secret (masked in every log line).
name: "Deploy"
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: "Deploy"
  cancel-in-progress: false
jobs:
  dev:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment: "dev"
    defaults:
      run:
        working-directory: "."
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_ENV: "dev"
      ROLE: ${{ secrets.DA_DEPLOY_ROLE_ARN_DEV }}
      AWS_REGION: ${{ secrets.DA_AWS_REGION }}
      INSTANCE: ${{ secrets.DA_HOST_INSTANCE_ID_DEV }}
      HOST_URL: ${{ secrets.DA_HOST_URL_DEV }}
      DOMAINS: ${{ secrets.DA_SITE_DOMAINS_DEV }}
      REGISTRY: ${{ secrets.DA_ECR_REPOSITORY_URL }}
    steps:
      - name: Check the infrastructure is applied
        run: |
          missing=""
          for name in ROLE AWS_REGION INSTANCE HOST_URL REGISTRY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::infrastructure not applied yet (missing:$missing) — run devops-agent up"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Build and push the release images (immutable tags)
        run: |
          registry_host="${REGISTRY%%/*}"
          repository="${REGISTRY#*/}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry_host"
          push() {
            tag="$1"; shift
            if aws ecr describe-images --region "$AWS_REGION" --repository-name "$repository" --image-ids "imageTag=$tag" >/dev/null 2>&1; then
              echo "$tag already pushed"; return 0
            fi
            docker build --pull -t "$REGISTRY:$tag" "$@"
            docker push "$REGISTRY:$tag"
          }
          push "api-$SHA" -f Dockerfile .
          push "web-$SHA" -f web/Dockerfile web
          push "bundle-$SHA" -f deploy/Dockerfile.bundle .
      - name: Deploy on the host (SSM Run Command)
        run: bash deploy/ci/ssm-deploy.sh
