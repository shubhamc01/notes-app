name: Infrastructure

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  plan:
    name: Validate and plan (PR)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Configure read-only AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DA_INFRA_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.DA_AWS_REGION }}
      - name: Check required plan variables
        env:
          AWS_REGION: ${{ vars.DA_AWS_REGION }}
          STATE_BUCKET: ${{ vars.DA_STATE_BUCKET }}
          PLAN_ROLE_ARN: ${{ vars.DA_INFRA_PLAN_ROLE_ARN }}
        run: |
          for name in AWS_REGION STATE_BUCKET PLAN_ROLE_ARN; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required infrastructure variable: $name" >&2
              exit 1
            fi
          done
      - name: Format, validate, plan, and enforce policy in root order
        env:
          AWS_REGION: ${{ vars.DA_AWS_REGION }}
          STATE_BUCKET: ${{ vars.DA_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          for root in infra/dev; do
            echo "## Terraform plan: ${root}" >> "$GITHUB_STEP_SUMMARY"
            terraform -chdir="$root" fmt -check -recursive
            terraform -chdir="$root" init -input=false \
              -backend-config="bucket=${STATE_BUCKET}" \
              -backend-config="key=notes-app/${root}.tfstate" \
              -backend-config="region=${AWS_REGION}"
            terraform -chdir="$root" validate

            plan_file="${RUNNER_TEMP}/$(basename "$root").tfplan"
            plan_json="${RUNNER_TEMP}/$(basename "$root").plan.json"
            terraform -chdir="$root" plan -input=false -lock=false -out="$plan_file"
            terraform show -json "$plan_file" > "$plan_json"
            python3 infra/policy_check.py "$root" "$plan_json"

            python3 - "$plan_json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          plan_path, summary_path = sys.argv[1:]
          with open(plan_path, encoding="utf-8") as stream:
              plan = json.load(stream)
          changes = plan.get("resource_changes") or []
          with open(summary_path, "a", encoding="utf-8") as summary:
              if not changes:
                  summary.write("No resource changes.\n\n")
              else:
                  for change in changes:
                      address = change.get("address", "(unknown address)")
                      actions = ", ".join(change.get("change", {}).get("actions", []))
                      summary.write(f"- `{address}` — `{actions}`\n")
                  summary.write("\n")
          PY
          done

  apply:
    name: Plan, policy-check, and apply (merge)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Protect this GitHub Environment with the appropriate reviewers/settings.
    environment: dev-infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check required apply variables
        env:
          AWS_REGION: ${{ vars.DA_AWS_REGION }}
          STATE_BUCKET: ${{ vars.DA_STATE_BUCKET }}
          APPLY_ROLE_ARN: ${{ vars.DA_INFRA_APPLY_ROLE_ARN_DEV }}
        run: |
          for name in AWS_REGION STATE_BUCKET APPLY_ROLE_ARN; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required infrastructure variable: $name" >&2
              exit 1
            fi
          done
      - name: Configure infrastructure apply credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DA_INFRA_APPLY_ROLE_ARN_DEV }}
          aws-region: ${{ vars.DA_AWS_REGION }}
      - name: Plan, policy-check, and apply saved plan in root order
        env:
          AWS_REGION: ${{ vars.DA_AWS_REGION }}
          STATE_BUCKET: ${{ vars.DA_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          for root in infra/dev; do
            echo "## Terraform apply plan: ${root}" >> "$GITHUB_STEP_SUMMARY"
            terraform -chdir="$root" fmt -check -recursive
            terraform -chdir="$root" init -input=false \
              -backend-config="bucket=${STATE_BUCKET}" \
              -backend-config="key=notes-app/${root}.tfstate" \
              -backend-config="region=${AWS_REGION}"
            terraform -chdir="$root" validate

            plan_file="${RUNNER_TEMP}/$(basename "$root").tfplan"
            plan_json="${RUNNER_TEMP}/$(basename "$root").plan.json"
            terraform -chdir="$root" plan -input=false -out="$plan_file"
            terraform show -json "$plan_file" > "$plan_json"
            python3 infra/policy_check.py "$root" "$plan_json"

            python3 - "$plan_json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          plan_path, summary_path = sys.argv[1:]
          with open(plan_path, encoding="utf-8") as stream:
              plan = json.load(stream)
          changes = plan.get("resource_changes") or []
          with open(summary_path, "a", encoding="utf-8") as summary:
              if not changes:
                  summary.write("No resource changes.\n\n")
              else:
                  for change in changes:
                      address = change.get("address", "(unknown address)")
                      actions = ", ".join(change.get("change", {}).get("actions", []))
                      summary.write(f"- `{address}` — `{actions}`\n")
                  summary.write("\n")
          PY

            # Apply precisely the reviewed and policy-checked plan created above.
            terraform -chdir="$root" apply -input=false "$plan_file"
          done
