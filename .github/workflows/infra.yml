name: Infrastructure
on:
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
permissions:
  id-token: write
  contents: read
jobs:
  plan-dev:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - name: Check bootstrap bindings
        id: bootstrap
        env:
          REGION: ${{ vars.DA_AWS_REGION }}
          PLAN_ROLE: ${{ vars.DA_INFRA_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$REGION" ] || [ -z "$PLAN_ROLE" ]; then
            echo 'infrastructure bootstrap not applied yet — run devops-agent up (or apply) first'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.bootstrap.outputs.ready == 'true'
      - uses: hashicorp/setup-terraform@v3
        if: steps.bootstrap.outputs.ready == 'true'
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.bootstrap.outputs.ready == 'true'
        with:
          role-to-assume: ${{ vars.DA_INFRA_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.DA_AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Format, validate, plan and enforce policy (infra/dev)
        id: plan
        if: steps.bootstrap.outputs.ready == 'true'
        working-directory: infra/dev
        env:
          TF_IN_AUTOMATION: 'true'
          TF_INPUT: 'false'
        run: |
          set -euo pipefail
          terraform fmt -check
          terraform init -input=false
          terraform validate
          set +e
          terraform plan -input=false -lock=false -detailed-exitcode -out=plan.tfplan
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          terraform show -json plan.tfplan > plan.json
          python3 "$GITHUB_WORKSPACE/infra/policy_check.py" infra/dev plan.json
          if [ "$code" -eq 2 ]; then echo 'changed=true' >> "$GITHUB_OUTPUT"; else echo 'changed=false' >> "$GITHUB_OUTPUT"; fi
          python3 - <<'PY'
          import json, os
          with open('plan.json', encoding='utf-8') as f:
              plan = json.load(f)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('### infra/dev resource changes\n')
              changes = plan.get('resource_changes', [])
              if not changes:
                  out.write('No resource changes.\n')
              for item in changes:
                  # Never output attributes, values, outputs, or plan files.
                  address = item['address'].replace('|', '\\|').replace('`', '\\`').replace('\n', ' ')
                  actions = ', '.join(item['change']['actions'])
                  out.write(f'- `{address}`: {actions}\n')
          PY
  apply-dev:
    needs: plan-dev
    if: github.event_name == 'push' && needs.plan-dev.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: dev-infra
    concurrency:
      group: terraform-dev
      cancel-in-progress: false
    steps:
      - name: Check apply bindings
        env:
          REGION: ${{ vars.DA_AWS_REGION }}
          ROLE: ${{ vars.DA_INFRA_APPLY_ROLE_ARN_DEV }}
        run: |
          if [ -z "$REGION" ] || [ -z "$ROLE" ]; then echo 'infrastructure not applied yet' >&2; exit 1; fi
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DA_INFRA_APPLY_ROLE_ARN_DEV }}
          aws-region: ${{ vars.DA_AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Re-plan, enforce policy and apply that exact saved plan
        working-directory: infra/dev
        env:
          TF_IN_AUTOMATION: 'true'
          TF_INPUT: 'false'
        run: |
          set -euo pipefail
          terraform fmt -check
          terraform init -input=false
          terraform validate
          terraform plan -input=false -out=plan.tfplan
          terraform show -json plan.tfplan > plan.json
          python3 "$GITHUB_WORKSPACE/infra/policy_check.py" infra/dev plan.json
          terraform apply -input=false -auto-approve plan.tfplan
