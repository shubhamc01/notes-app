name: Infrastructure

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']

permissions:
  contents: read
  id-token: write

concurrency:
  group: notes-app-infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-check:
    # Never grant OIDC credentials to a fork PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check bootstrap before any planning
        id: check
        env:
          DA_AWS_REGION: ${{ vars.DA_AWS_REGION }}
          DA_INFRA_PLAN_ROLE_ARN: ${{ vars.DA_INFRA_PLAN_ROLE_ARN }}
        run: |
          if [[ -z "$DA_AWS_REGION" || -z "$DA_INFRA_PLAN_ROLE_ARN" ]]; then
            echo 'infrastructure bootstrap not applied yet — run devops-agent up (or apply) first'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

  pr-plan:
    if: github.event_name == 'pull_request' && needs.bootstrap-check.outputs.ready == 'true'
    needs: bootstrap-check
    runs-on: ubuntu-latest
    env:
      DA_AWS_REGION: ${{ vars.DA_AWS_REGION }}
      DA_STATE_BUCKET: ${{ vars.DA_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Verify state bucket is configured
        run: |
          if [[ -z "$DA_STATE_BUCKET" ]]; then echo 'infrastructure not applied yet' >&2; exit 1; fi
      - name: Assume read-only plan role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.DA_AWS_REGION }}
          role-to-assume: ${{ vars.DA_INFRA_PLAN_ROLE_ARN }}
          audience: sts.amazonaws.com
      - name: Format, initialize, validate, plan and enforce policy (infra/dev)
        shell: bash
        run: |
          set -euo pipefail
          root=infra/dev
          terraform -chdir="$root" fmt -check
          terraform -chdir="$root" init -input=false -backend-config="bucket=${DA_STATE_BUCKET}" -backend-config="region=${DA_AWS_REGION}"
          terraform -chdir="$root" validate
          # The saved plan is local to the runner. Do not print plan output or
          # upload its JSON: it can contain sensitive values.
          if ! terraform -chdir="$root" plan -lock=false -input=false -out="$RUNNER_TEMP/dev.tfplan" > "$RUNNER_TEMP/plan.log" 2>&1; then
            echo 'Terraform plan failed; inspect the root without publishing plan values' >&2
            exit 1
          fi
          terraform -chdir="$root" show -json "$RUNNER_TEMP/dev.tfplan" > "$RUNNER_TEMP/dev.plan.json"
          python3 infra/policy_check.py "$root" "$RUNNER_TEMP/dev.plan.json"
          python3 - "$RUNNER_TEMP/dev.plan.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding='utf-8') as source:
              changes = json.load(source).get('resource_changes', [])
          print('### infra/dev resource actions')
          for change in changes:
              print('- ' + change['address'] + ': ' + ', '.join(change['change']['actions']))
          PY

  dev-apply:
    if: github.event_name == 'push' && needs.bootstrap-check.outputs.ready == 'true'
    needs: bootstrap-check
    environment: dev-infra
    runs-on: ubuntu-latest
    env:
      DA_AWS_REGION: ${{ vars.DA_AWS_REGION }}
      DA_STATE_BUCKET: ${{ vars.DA_STATE_BUCKET }}
      DA_INFRA_APPLY_ROLE_ARN_DEV: ${{ vars.DA_INFRA_APPLY_ROLE_ARN_DEV }}
    steps:
      - name: Check apply configuration
        run: |
          if [[ -z "$DA_STATE_BUCKET" || -z "$DA_INFRA_APPLY_ROLE_ARN_DEV" ]]; then
            echo 'infrastructure not applied yet' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Assume dev apply role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.DA_AWS_REGION }}
          role-to-assume: ${{ env.DA_INFRA_APPLY_ROLE_ARN_DEV }}
          audience: sts.amazonaws.com
      - name: Format, initialize, validate, plan, enforce policy, apply saved plan (infra/dev)
        shell: bash
        run: |
          set -euo pipefail
          root=infra/dev
          terraform -chdir="$root" fmt -check
          terraform -chdir="$root" init -input=false -backend-config="bucket=${DA_STATE_BUCKET}" -backend-config="region=${DA_AWS_REGION}"
          terraform -chdir="$root" validate
          if ! terraform -chdir="$root" plan -input=false -out="$RUNNER_TEMP/dev.tfplan" > "$RUNNER_TEMP/plan.log" 2>&1; then
            echo 'Terraform plan failed; no apply performed' >&2
            exit 1
          fi
          terraform -chdir="$root" show -json "$RUNNER_TEMP/dev.tfplan" > "$RUNNER_TEMP/dev.plan.json"
          python3 infra/policy_check.py "$root" "$RUNNER_TEMP/dev.plan.json"
          if ! terraform -chdir="$root" apply -input=false "$RUNNER_TEMP/dev.tfplan" > "$RUNNER_TEMP/apply.log" 2>&1; then
            echo 'Terraform apply of the checked saved plan failed' >&2
            exit 1
          fi
