name: Infrastructure
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: notes-app-infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan-dev:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check infrastructure bootstrap
        id: bootstrap
        env:
          REGION: ${{ vars.DA_AWS_REGION }}
          PLAN_ROLE: ${{ vars.DA_INFRA_PLAN_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.DA_STATE_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "$REGION" ] || [ -z "$PLAN_ROLE" ] || [ -z "$STATE_BUCKET" ]; then
            echo 'infrastructure bootstrap not applied yet — run devops-agent up (or apply) first'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.bootstrap.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        if: steps.bootstrap.outputs.ready == 'true'
        with:
          terraform_wrapper: false
      - name: Authenticate plan role using OIDC
        if: steps.bootstrap.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.DA_AWS_REGION }}
          role-to-assume: ${{ vars.DA_INFRA_PLAN_ROLE_ARN }}
          audience: sts.amazonaws.com
      - name: Format, initialize, validate, plan and enforce policy (infra/dev)
        if: steps.bootstrap.outputs.ready == 'true'
        env:
          REGION: ${{ vars.DA_AWS_REGION }}
          STATE_BUCKET: ${{ vars.DA_STATE_BUCKET }}
        run: |
          set -euo pipefail
          terraform -chdir=infra/dev fmt -check
          terraform -chdir=infra/dev init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$REGION"
          terraform -chdir=infra/dev validate
          # Never write the human-readable plan to CI logs: it can contain values.
          if ! terraform -chdir=infra/dev plan -input=false -lock=false -out=plan.tfplan > /tmp/notes-infra-plan.log 2>&1; then
            echo 'Terraform plan failed (plan output withheld to protect values).' >&2
            exit 1
          fi
          terraform -chdir=infra/dev show -json plan.tfplan > plan.json
          python3 infra/policy_check.py infra/dev infra/dev/plan.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          plan = json.loads(Path('infra/dev/plan.json').read_text())
          print('### infra/dev resource actions')
          for item in plan.get('resource_changes', []):
              print(f"- `{item['address']}`: `{','.join(item['change']['actions'])}`")
          PY
      - name: Remove local plan artifacts
        if: always() && steps.bootstrap.outputs.ready == 'true'
        run: rm -f infra/dev/plan.tfplan infra/dev/plan.json /tmp/notes-infra-plan.log

  apply-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev-infra
    runs-on: ubuntu-latest
    steps:
      - name: Check infrastructure bootstrap
        id: bootstrap
        env:
          REGION: ${{ vars.DA_AWS_REGION }}
          PLAN_ROLE: ${{ vars.DA_INFRA_PLAN_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.DA_STATE_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "$REGION" ] || [ -z "$PLAN_ROLE" ] || [ -z "$STATE_BUCKET" ]; then
            echo 'infrastructure bootstrap not applied yet — run devops-agent up (or apply) first'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check apply role
        if: steps.bootstrap.outputs.ready == 'true'
        env:
          APPLY_ROLE: ${{ vars.DA_INFRA_APPLY_ROLE_ARN_DEV }}
        run: |
          if [ -z "$APPLY_ROLE" ]; then
            echo 'infrastructure not applied yet' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        if: steps.bootstrap.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        if: steps.bootstrap.outputs.ready == 'true'
        with:
          terraform_wrapper: false
      - name: Authenticate apply role using OIDC
        if: steps.bootstrap.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.DA_AWS_REGION }}
          role-to-assume: ${{ vars.DA_INFRA_APPLY_ROLE_ARN_DEV }}
          audience: sts.amazonaws.com
      - name: Format, initialize, validate, plan, enforce policy and apply (infra/dev)
        if: steps.bootstrap.outputs.ready == 'true'
        env:
          REGION: ${{ vars.DA_AWS_REGION }}
          STATE_BUCKET: ${{ vars.DA_STATE_BUCKET }}
        run: |
          set -euo pipefail
          terraform -chdir=infra/dev fmt -check
          terraform -chdir=infra/dev init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$REGION"
          terraform -chdir=infra/dev validate
          if ! terraform -chdir=infra/dev plan -input=false -out=plan.tfplan > /tmp/notes-infra-plan.log 2>&1; then
            echo 'Terraform plan failed (plan output withheld to protect values).' >&2
            exit 1
          fi
          terraform -chdir=infra/dev show -json plan.tfplan > plan.json
          python3 infra/policy_check.py infra/dev infra/dev/plan.json
          # Apply the same saved, policy-approved plan; do not replan after the check.
          if ! terraform -chdir=infra/dev apply -input=false -auto-approve plan.tfplan > /tmp/notes-infra-apply.log 2>&1; then
            echo 'Terraform apply failed (apply output withheld to protect values).' >&2
            exit 1
          fi
      - name: Remove local plan artifacts
        if: always() && steps.bootstrap.outputs.ready == 'true'
        run: rm -f infra/dev/plan.tfplan infra/dev/plan.json /tmp/notes-infra-plan.log /tmp/notes-infra-apply.log
