name: Infrastructure
# infra/bootstrap is CLI-only and uses local state; this workflow never touches it.
on:
  pull_request:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
permissions:
  contents: read
  id-token: write
jobs:
  plan-dev:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Bootstrap guard
        id: guard
        env:
          REGION: ${{ vars.DA_AWS_REGION }}
          ROLE: ${{ vars.DA_INFRA_PLAN_ROLE_ARN }}
        run: |
          if [[ -z "$REGION" || -z "$ROLE" ]]; then
            echo 'infrastructure bootstrap not applied yet — run devops-agent up (or apply) first'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        if: steps.guard.outputs.ready == 'true'
        with:
          terraform_wrapper: false
      - name: Assume read-only planning role
        if: steps.guard.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.DA_AWS_REGION }}
          role-to-assume: ${{ vars.DA_INFRA_PLAN_ROLE_ARN }}
          audience: sts.amazonaws.com
      - name: Format, initialize, validate and plan dev
        if: steps.guard.outputs.ready == 'true'
        env:
          TF_IN_AUTOMATION: 'true'
          TF_VAR_aws_region: ${{ vars.DA_AWS_REGION }}
          TF_VAR_state_bucket: ${{ vars.DA_STATE_BUCKET }}
        run: |
          set -euo pipefail
          terraform -chdir=infra/dev fmt -check
          terraform -chdir=infra/dev init -input=false
          terraform -chdir=infra/dev validate
          terraform -chdir=infra/dev plan -input=false -lock=false -out=plan.tfplan
          terraform -chdir=infra/dev show -json plan.tfplan > infra/dev/plan.json
          python3 infra/policy_check.py infra/dev infra/dev/plan.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open('infra/dev/plan.json') as f: plan = json.load(f)
          print('### infra/dev — resource actions')
          for change in plan.get('resource_changes', []):
              address = change['address'].replace('`', '')
              actions = ', '.join(change['change']['actions'])
              print(f'- `{address}`: {actions}')
          PY
  apply-dev:
    if: ${{ github.event_name == 'push' }}
    environment: dev-infra
    runs-on: ubuntu-latest
    concurrency:
      group: infra-dev
      cancel-in-progress: false
    steps:
      - name: Bootstrap guard
        id: guard
        env:
          REGION: ${{ vars.DA_AWS_REGION }}
          PLAN_ROLE: ${{ vars.DA_INFRA_PLAN_ROLE_ARN }}
          APPLY_ROLE: ${{ vars.DA_INFRA_APPLY_ROLE_ARN_DEV }}
        run: |
          if [[ -z "$REGION" || -z "$PLAN_ROLE" ]]; then
            echo 'infrastructure bootstrap not applied yet — run devops-agent up (or apply) first'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          elif [[ -z "$APPLY_ROLE" ]]; then
            echo 'infrastructure not applied yet'; exit 1
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        if: steps.guard.outputs.ready == 'true'
        with:
          terraform_wrapper: false
      - name: Assume dev infrastructure apply role
        if: steps.guard.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.DA_AWS_REGION }}
          role-to-assume: ${{ vars.DA_INFRA_APPLY_ROLE_ARN_DEV }}
          audience: sts.amazonaws.com
      - name: Format, initialize, validate, policy-check and apply saved dev plan
        if: steps.guard.outputs.ready == 'true'
        env:
          TF_IN_AUTOMATION: 'true'
          TF_VAR_aws_region: ${{ vars.DA_AWS_REGION }}
          TF_VAR_state_bucket: ${{ vars.DA_STATE_BUCKET }}
        run: |
          set -euo pipefail
          terraform -chdir=infra/dev fmt -check
          terraform -chdir=infra/dev init -input=false
          terraform -chdir=infra/dev validate
          terraform -chdir=infra/dev plan -input=false -out=plan.tfplan
          terraform -chdir=infra/dev show -json plan.tfplan > infra/dev/plan.json
          python3 infra/policy_check.py infra/dev infra/dev/plan.json
          terraform -chdir=infra/dev apply -input=false plan.tfplan
