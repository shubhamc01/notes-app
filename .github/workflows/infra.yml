name: Infrastructure

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Check infrastructure bootstrap
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          AWS_REGION: ${{ vars.DA_AWS_REGION }}
          PLAN_ROLE: ${{ vars.DA_INFRA_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$AWS_REGION" ] || [ -z "$PLAN_ROLE" ]; then
            echo 'infrastructure bootstrap not applied yet — run devops-agent up (or apply) first'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

  plan-pr:
    name: Plan infra/dev (PR)
    needs: gate
    if: needs.gate.outputs.ready == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DA_INFRA_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.DA_AWS_REGION }}
      - name: Format, validate, plan, and policy-check infra/dev
        env:
          AWS_REGION: ${{ vars.DA_AWS_REGION }}
          STATE_BUCKET: ${{ vars.DA_STATE_BUCKET }}
        run: |
          set -euo pipefail
          root=infra/dev
          terraform -chdir="$root" fmt -check -recursive
          terraform -chdir="$root" init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="key=notes-app/dev/terraform.tfstate" -backend-config="region=$AWS_REGION"
          terraform -chdir="$root" validate -no-color
          terraform -chdir="$root" plan -input=false -no-color -lock=false -out="$RUNNER_TEMP/dev.tfplan"
          terraform -chdir="$root" show -json "$RUNNER_TEMP/dev.tfplan" > "$RUNNER_TEMP/dev-plan.json"
          python3 infra/policy_check.py "$root" "$RUNNER_TEMP/dev-plan.json"
          python3 - "$RUNNER_TEMP/dev-plan.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          plan=json.load(open(sys.argv[1], encoding='utf-8'))
          print('## Terraform plan: infra/dev')
          print('| Resource address | Actions |\n|---|---|')
          for item in plan.get('resource_changes', []):
              actions=', '.join(item.get('change', {}).get('actions', []))
              print(f"| `{item.get('address','')}` | `{actions}` |")
          PY

  apply-main:
    name: Apply infra/dev
    needs: gate
    if: needs.gate.outputs.ready == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev-infra
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check apply role
        env:
          APPLY_ROLE: ${{ vars.DA_INFRA_APPLY_ROLE_ARN_DEV }}
        run: |
          if [ -z "$APPLY_ROLE" ]; then echo 'infrastructure not applied yet' >&2; exit 1; fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DA_INFRA_APPLY_ROLE_ARN_DEV }}
          aws-region: ${{ vars.DA_AWS_REGION }}
      - name: Create and check saved plan, then apply that exact plan
        env:
          AWS_REGION: ${{ vars.DA_AWS_REGION }}
          STATE_BUCKET: ${{ vars.DA_STATE_BUCKET }}
        run: |
          set -euo pipefail
          root=infra/dev
          terraform -chdir="$root" fmt -check -recursive
          terraform -chdir="$root" init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="key=notes-app/dev/terraform.tfstate" -backend-config="region=$AWS_REGION"
          terraform -chdir="$root" validate -no-color
          terraform -chdir="$root" plan -input=false -no-color -out="$RUNNER_TEMP/dev.tfplan"
          terraform -chdir="$root" show -json "$RUNNER_TEMP/dev.tfplan" > "$RUNNER_TEMP/dev-plan.json"
          python3 infra/policy_check.py "$root" "$RUNNER_TEMP/dev-plan.json"
          terraform -chdir="$root" apply -input=false -auto-approve "$RUNNER_TEMP/dev.tfplan"
