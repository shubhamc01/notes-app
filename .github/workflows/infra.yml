# ENGINE-RENDERED by devops-agent (knowledge/delivery) — do not edit; regenerate instead.
# Pull requests: plan every root read-only. Merge: plan first; only roots WITH changes go to the
# approval-gated <env>-infra apply (a merge with nothing to change finishes green, no approval asked).
# infra/bootstrap is never touched by CI (a human applies it with devops-agent).
name: Infrastructure
on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: ["main"]
    paths: ["infra/**", ".github/workflows/infra.yml"]
permissions:
  contents: read
  id-token: write
  pull-requests: read
concurrency:
  group: infrastructure
  cancel-in-progress: false
env:
  AWS_REGION: ${{ secrets.DA_AWS_REGION }}
  PLAN_ROLE: ${{ secrets.DA_INFRA_PLAN_ROLE_ARN }}
jobs:
  plan:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      dev: ${{ steps.plan.outputs.dev }}
    steps:
      - name: Bootstrap applied?
        id: ready
        run: |
          if [ -z "$PLAN_ROLE" ] || [ -z "$AWS_REGION" ]; then
            echo "::notice::infrastructure bootstrap not applied yet — run devops-agent up (or apply) first"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.ready.outputs.ready == 'true'
      - uses: hashicorp/setup-terraform@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.ready.outputs.ready == 'true'
        with:
          role-to-assume: ${{ env.PLAN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Plan (read-only, checked against the platform policy)
        id: plan
        if: steps.ready.outputs.ready == 'true'
        run: |
          for pair in infra/dev=dev; do
            root="${pair%%=*}"; key="${pair#*=}"
            terraform -chdir="$root" fmt -check -recursive
            terraform -chdir="$root" init -input=false -lock=false
            terraform -chdir="$root" validate -no-color
            set +e
            terraform -chdir="$root" plan -input=false -lock=false -no-color -detailed-exitcode -out=tfplan > /dev/null
            code=$?
            set -e
            [ "$code" -ne 1 ] || { echo "::error::plan failed for $root"; exit 1; }
            terraform -chdir="$root" show -json tfplan > "$root/plan.json"
            python3 infra/policy_check.py "$root" "$root/plan.json"
            echo "## $root" >> "$GITHUB_STEP_SUMMARY"
            terraform -chdir="$root" show -no-color tfplan | grep -E '^\s+# ' | sed 's/^ *//' >> "$GITHUB_STEP_SUMMARY" || true
            if [ "$code" -eq 2 ]; then echo "$key=true" >> "$GITHUB_OUTPUT"; else echo "$key=false" >> "$GITHUB_OUTPUT"; fi
          done
  apply-dev:
    needs: ["plan"]
    if: >-
      always() && github.event_name == 'push' && needs.plan.result == 'success' &&
      needs.plan.outputs.dev == 'true'
    runs-on: ubuntu-24.04
    environment: "dev-infra"
    env:
      APPLY_ROLE: ${{ secrets.DA_INFRA_APPLY_ROLE_ARN_DEV }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.APPLY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Apply infra/dev (exactly the plan that passed the policy check)
        run: |
          terraform -chdir=infra/dev init -input=false
          terraform -chdir=infra/dev plan -input=false -no-color -out=tfplan > /dev/null
          terraform -chdir=infra/dev show -json tfplan > infra/dev/plan.json
          python3 infra/policy_check.py infra/dev infra/dev/plan.json
          terraform -chdir=infra/dev apply -input=false -no-color tfplan
