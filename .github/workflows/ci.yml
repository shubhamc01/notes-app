name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag "notes-app:ci-${GITHUB_SHA}" -f Dockerfile .
      - name: Build deployment bundle
        run: docker build --tag "notes-app:bundle-${GITHUB_SHA}" -f Dockerfile.bundle .
