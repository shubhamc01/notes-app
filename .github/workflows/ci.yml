name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies and CI tools
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -t notes-app-api:${{ github.sha }} .
      - name: Build web image
        run: docker build -t notes-app-web:${{ github.sha }} ./web
