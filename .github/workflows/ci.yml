name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
      - name: Build production image
        run: docker build --tag "notes-app:${GITHUB_SHA}" .
