name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  build-image:
    name: Build container
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag notes-app:ci .
      - name: Verify image metadata
        run: docker image inspect notes-app:ci >/dev/null
