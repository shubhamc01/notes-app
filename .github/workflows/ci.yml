# ENGINE-RENDERED by devops-agent (knowledge/delivery) — do not edit; regenerate instead.
# Pull requests run everything a release needs except the cloud: the app's own install/lint/test/build
# and a real build of every image and of the release bundle — a broken release fails here, before merge.
name: "CI"
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "CI-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  images:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: "."
    steps:
      - uses: actions/checkout@v7
      - name: "build image api"
        run: "docker build --pull -f Dockerfile ."
      - name: "build image web"
        run: "docker build --pull -f web/Dockerfile web"
      - name: build the release bundle
        run: docker build -f deploy/Dockerfile.bundle .
