name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
  build:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag notes-app:ci --file Dockerfile .
      - name: Build deployment bundle
        run: docker build --tag notes-app-bundle:ci --file Dockerfile.bundle .
  notify-failure:
    if: ${{ failure() }}
    needs: [lint-test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Notify if configured
        env:
          WEBHOOK: ${{ secrets.FAILURE_WEBHOOK_URL }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then exit 0; fi
          python3 - <<'PY'
          import json, os, urllib.request
          body = json.dumps({'text': f"CI failed: {os.environ['BRANCH']} {os.environ['COMMIT']} {os.environ['RUN_URL']}"}).encode()
          urllib.request.urlopen(urllib.request.Request(os.environ['WEBHOOK'], data=body, headers={'Content-Type': 'application/json'}), timeout=10).close()
          PY
