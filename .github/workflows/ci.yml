name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff
      - name: Lint API
        run: ruff check .
      - name: Test API
        run: pytest -q

  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint web
        run: npm run lint --if-present
      - name: Test web
        env:
          CI: 'true'
        run: npm test --if-present

  build:
    needs: [api-quality, web-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API and web images without publishing
        run: |
          docker build --tag "notes-app-api:${GITHUB_SHA}" .
          docker build --tag "notes-app-web:${GITHUB_SHA}" ./web
